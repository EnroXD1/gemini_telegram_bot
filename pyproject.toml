[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-telegram-assistant"
version = "1.10.2"
description = "Telegram Business AI assistant with Google, OpenRouter, Groq and chat monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.30.0,<4.0.0",
    "google-genai>=2.11.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "telegramify-markdown>=1.2.0,<2.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "Pillow>=12.0.0,<13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[project.scripts]
gemini-telegram-bot = "bot.__main__:main"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.setuptools.package-data]
bot = ["assets/*.mp4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
